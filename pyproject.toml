[project]
description = "Profiling, testing, and benchmarking"
name = "honesty"

license = {text = "MIT"}

authors = [
  {name = "Synodic Software", email = "contact@synodic.software"},
]

readme = "README.md"

dynamic = ["version"]

dependencies = [
]
requires-python = ">=3.13"

[project.urls]
homepage = "https://github.com/Synodic-Software/Honesty"
repository = "https://github.com/Synodic-Software/Honesty"

[dependency-groups]
dev = [
  "cppython>=0.8.0",
]
lint = [
  "ruff>=0.8.0",
  "mypy>=1.13",
  "isort>=5.13.2",
]
test = [
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
log_cli = true
testpaths = [
  "tests",
]

[tool.mypy]
exclude = "__pypackages__"
plugins = ["pydantic.mypy"]
strict = true

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = [
  "D206",
  "D300",
  "D415",
  "E111",
  "E114",
  "E117",
]
select = [
  "D", # pydocstyle
  "F", # Pyflakes
  "I", # isort
  "PL", # pylint
  "UP", # pyupgrade
  "E", # pycodestyle
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "PT", # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[tool.pdm.options]
update = ["--update-all"]

[tool.pdm.scripts]
build = {shell = "cppython build"}
test = {shell = "cppython test"}

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]

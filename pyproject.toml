[project]
description = "Profiling, testing, and benchmarking"
name = "honesty"

license = { text = "MIT" }

authors = [{ name = "Synodic Software", email = "contact@synodic.software" }]

readme = "README.md"

dynamic = ["version"]

dependencies = []
requires-python = ">=3.13"

[project.urls]
homepage = "https://github.com/Synodic-Software/Honesty"
repository = "https://github.com/Synodic-Software/Honesty"

[project.optional-dependencies]
build = [
    "cppython[cmake,conan,git]>=0.9.3",
]
[dependency-groups]
lint = ["ruff>=0.12.3", "pyrefly>=0.24.0", "isort>=6.0.1"]
test = ["pytest-cov>=6.2.1", "pytest-mock>=3.14.1"]

[tool.cppython]
generator-name = "cmake"
provider-name = "conan"
dependencies = ["opentelemetry-cpp>=1.18.0"]

[tool.cppython.generator]
preset_file = "tool/cmake/platform/common/CMakePresets.json"
configuration_name = "default"

[tool.cppython.provider]
remotes = []

[tool.pytest.ini_options]
log_cli = true
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
ignore = ["D206", "D300", "D415", "E111", "E114", "E117"]
select = [
	"D",   # pydocstyle
	"F",   # Pyflakes
	"I",   # isort
	"PL",  # pylint
	"UP",  # pyupgrade
	"E",   # pycodestyle
	"B",   # flake8-bugbear
	"SIM", # flake8-simplify
	"PT",  # flake8-pytest-style
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "single"

[tool.coverage.report]
skip_empty = true

[tool.pdm.scripts]
build = { shell = "cppython build" }
test = { shell = "cppython test" }

[build-system]
build-backend = "pdm.backend"
requires = ["pdm.backend"]
